<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Prodotto di stagione</title>
<link rel="stylesheet" href="_base.css">
<style>
  .post { --pannello: 200, 38, 43; --accento: #fff; }
  .pill { background: var(--rosso); border-color: rgba(255,255,255,.35); }
</style>
</head>
<body>
<div class="post">
  <img class="foto" src="{{FOTO}}" alt="">
  <div class="velo"></div>
  <div class="pannello"></div>
  <div class="pill">{{ETICHETTA}}</div>
  <div class="blocco">
    <div class="barra"></div>
    <div class="titolo">{{TITOLO}}</div>
    <div class="sotto">{{SOTTOTITOLO}}</div>
    <div class="piede">
      <div class="logo-tile"><img src="../assets/logo-erica.png" alt="E.RIC.A Ricambi Auto"></div>
      <div class="piede-testo">In negozio a Conegliano<small>Viale Italia 193 · www.ericaricambi.it</small></div>
    </div>
  </div>
</div>
</body>
</html>
