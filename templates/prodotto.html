<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Prodotto di stagione</title>
<link rel="stylesheet" href="_base.css">
<style>
  .foto { position: absolute; inset: 0; width: 1080px; height: 1350px; object-fit: cover; }
  .velo { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,.05) 40%, rgba(0,0,0,.45) 100%); }
  .banda { position: absolute; left: 0; right: 0; bottom: 0; background: var(--rosso); color: #fff; padding: 56px 64px 44px 64px; display: flex; flex-direction: column; gap: 22px; }
  .banda::before { content: ""; position: absolute; left: 0; right: 0; top: -36px; height: 36px; background: var(--rosso); clip-path: polygon(0 100%, 100% 0, 100% 100%); }
  .titolo { font-family: Poppins, sans-serif; font-weight: 800; font-size: 64px; line-height: 1.1; text-transform: uppercase; letter-spacing: -.5px; }
  .sotto { font-size: 28px; font-weight: 500; line-height: 1.35; opacity: .95; }
  .marchio { width: 72px; height: 72px; background: #fff; display: flex; align-items: center; justify-content: center; font-family: Poppins, sans-serif; font-weight: 800; font-size: 46px; color: var(--rosso); line-height: 1; }
</style>
</head>
<body>
<div class="post" style="background: #2a1a1a; color: #fff">
  <img class="foto" src="{{FOTO}}" alt="">
  <div class="velo"></div>

  <div style="position: absolute; top: 56px; left: 64px">
    <div class="pill" style="background: var(--rosso); color: #fff">{{ETICHETTA}}</div>
  </div>

  <div class="banda">
    <div class="titolo">{{TITOLO}}</div>
    <div class="sotto">{{SOTTOTITOLO}}</div>
    <div style="display: flex; align-items: center; gap: 28px; margin-top: 18px">
      <div class="logo-tile"><img src="../assets/logo-erica.png" alt="E.RIC.A Ricambi Auto"></div>
      <div style="flex: 1; height: 4px; background: rgba(255,255,255,.7); border-radius: 2px"></div>
      <div style="font-size: 20px; font-weight: 700; letter-spacing: .5px">In negozio a Conegliano</div>
    </div>
  </div>
</div>
</body>
</html>
