<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Promo</title>
<link rel="stylesheet" href="_base.css">
</head>
<body>
<div class="post" style="background: var(--rosso); color: var(--bianco); padding: 72px 72px 0 72px">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <div class="brand" style="font-size: 44px">E.RIC.A</div>
      <div class="brand-sub" style="font-size: 18px; opacity: .9">Emporio Ricambi Auto</div>
    </div>
    <div class="pill" style="background: var(--bianco); color: var(--rosso-scuro)">{{ETICHETTA}}</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 120px">
    <div class="display" style="font-size: 260px; line-height: 1; letter-spacing: -10px; margin-bottom: 24px">{{GRANDE}}</div>
    <div style="font-family: Poppins, sans-serif; font-weight: 600; font-size: 60px; line-height: 1.15; max-width: 900px">{{TITOLO}}</div>
    <div style="font-size: 28px; font-weight: 500; margin-top: 24px; opacity: .92; max-width: 900px">{{NOTA}}</div>
  </div>

  <div style="margin-top: auto; margin-left: -72px; margin-right: -72px; background: var(--navy); padding: 44px 72px; display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="font-family: Poppins, sans-serif; font-weight: 800; font-size: 34px; line-height: 1">Vieni in negozio</div>
      <div style="font-size: 22px; font-weight: 500; opacity: .85">Viale Italia 193 · Conegliano (TV)</div>
    </div>
    <div style="font-size: 24px; font-weight: 700; letter-spacing: 1px">www.ericaricambi.it</div>
  </div>
</div>
</body>
</html>
