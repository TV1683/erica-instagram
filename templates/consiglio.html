<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Consiglio tecnico</title>
<link rel="stylesheet" href="_base.css">
</head>
<body>
<div class="post" style="background: var(--navy); color: var(--bianco); padding: 72px">
  <div style="position: absolute; right: -140px; top: -140px; width: 520px; height: 520px; border-radius: 50%; background: var(--blu); opacity: .35"></div>

  <div style="display: flex; justify-content: space-between; align-items: center; position: relative">
    <div class="brand">E.RIC.A</div>
    <div class="pill" style="background: var(--blu); color: var(--bianco)">{{ETICHETTA}}</div>
  </div>

  <div style="margin-top: 150px; display: flex; flex-direction: column; gap: 36px; position: relative">
    <div style="width: 120px; height: 10px; background: var(--rosso)"></div>
    <div class="display" style="font-size: 78px; line-height: 1.08; letter-spacing: -1px">{{DOMANDA}}</div>
  </div>

  <div style="margin-top: 72px; background: var(--bianco); color: var(--navy); border-radius: 20px; padding: 48px 52px; display: flex; gap: 36px; align-items: flex-start">
    <div class="display" style="font-size: 72px; line-height: 1; color: var(--rosso)">{{NUMERO}}</div>
    <div style="display: flex; flex-direction: column; gap: 14px">
      <div style="font-family: Poppins, sans-serif; font-weight: 700; font-size: 34px; line-height: 1.2">{{RISPOSTA_TITOLO}}</div>
      <div style="font-size: 24px; line-height: 1.45; font-weight: 500; color: #4A5A72">{{RISPOSTA}}</div>
    </div>
  </div>

  <div style="margin-top: auto; display: flex; justify-content: space-between; align-items: center; border-top: 2px solid rgba(255,255,255,.25); padding-top: 32px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="font-family: Poppins, sans-serif; font-weight: 700; font-size: 28px">Chiedi ai nostri tecnici</div>
      <div style="font-size: 20px; font-weight: 500; opacity: .8">Viale Italia 193 · Conegliano (TV)</div>
    </div>
    <div style="font-size: 22px; font-weight: 700">www.ericaricambi.it</div>
  </div>
</div>
</body>
</html>
