<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Consiglio manutenzione</title>
<link rel="stylesheet" href="_base.css">
<style>
  .foto { height: 920px; }
  .etichetta { background: var(--navy); }
  .pannello { position: absolute; left: 0; right: 0; top: 860px; bottom: 0; background: linear-gradient(to bottom, rgba(30,47,77,0) 0%, var(--navy) 60px, var(--navy) 100%); padding: 120px 64px 56px 64px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; }
  .titolo { text-transform: none; font-size: 62px; letter-spacing: -.5px; }
  .piede { margin-top: auto; }
</style>
</head>
<body>
<div class="post">
  <img class="foto" src="{{FOTO}}" alt="">
  <div class="etichetta">{{ETICHETTA}}</div>
  <div class="pannello">
    <div class="titolo">{{TITOLO}}</div>
    <div class="sotto">{{CONSIGLIO}}</div>
    <div class="piede">
      <img src="../assets/logo-erica.png" alt="E.RIC.A Ricambi Auto">
      <div class="riga"></div>
      <div class="sito">Viale Italia 193, Conegliano<small>www.ericaricambi.it</small></div>
    </div>
  </div>
</div>
</body>
</html>
