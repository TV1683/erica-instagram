<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Notizia</title>
<link rel="stylesheet" href="_base.css">
<style>
  .foto { position: absolute; inset: 0; width: 1080px; height: 1350px; object-fit: cover; }
  .velo { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0) 30%, rgba(0,0,0,.55) 55%, rgba(0,0,0,.92) 100%); }
  .titolo { font-family: Poppins, sans-serif; font-weight: 800; font-size: 66px; line-height: 1.12; text-transform: uppercase; color: #fff; letter-spacing: -.5px; text-shadow: 0 2px 18px rgba(0,0,0,.45); }
  .marchio { width: 96px; height: 96px; background: var(--rosso); display: flex; align-items: center; justify-content: center; font-family: Poppins, sans-serif; font-weight: 800; font-size: 60px; color: #fff; line-height: 1; }
</style>
</head>
<body>
<div class="post" style="background: #0F1726; color: #fff">
  <img class="foto" src="{{FOTO}}" alt="">
  <div class="velo"></div>

  <div style="position: absolute; top: 56px; left: 64px; display: flex; align-items: center; gap: 16px">
    <div class="pill" style="background: rgba(255,255,255,.14); color: #fff; backdrop-filter: blur(6px); border: 1.5px solid rgba(255,255,255,.35)">{{ETICHETTA}}</div>
  </div>

  <div style="position: absolute; left: 64px; right: 64px; bottom: 96px; display: flex; flex-direction: column; gap: 56px">
    <div class="titolo">{{TITOLO}}</div>
    <div style="display: flex; align-items: center; gap: 40px">
      <div class="logo-tile"><img src="../assets/logo-erica.png" alt="E.RIC.A Ricambi Auto"></div>
      <div style="flex: 1; height: 5px; background: #fff; border-radius: 3px"></div>
    </div>
  </div>

  <div style="position: absolute; left: 64px; right: 64px; bottom: 44px; display: flex; justify-content: space-between; font-size: 20px; font-weight: 600; opacity: .85">
    <span>E.RIC.A · Emporio Ricambi Auto · Conegliano</span>
    <span>www.ericaricambi.it</span>
  </div>
</div>
</body>
</html>
