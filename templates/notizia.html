<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Notizia</title>
<link rel="stylesheet" href="_base.css">
<style>
  .velo { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(22,36,60,0) 42%, rgba(22,36,60,.55) 58%, rgba(22,36,60,.96) 72%, var(--navy-scuro) 100%); }
  .blocco { position: absolute; left: 64px; right: 64px; bottom: 64px; display: flex; flex-direction: column; gap: 56px; }
  .titolo { font-size: 66px; }
</style>
</head>
<body>
<div class="post">
  <img class="foto" src="{{FOTO}}" alt="">
  <div class="velo"></div>
  <div class="etichetta">{{ETICHETTA}}</div>
  <div class="blocco">
    <div class="titolo">{{TITOLO}}</div>
    <div class="fonte">{{FONTE}}</div>
    <div class="piede">
      <img src="../assets/logo-erica.png" alt="E.RIC.A Ricambi Auto">
      <div class="riga"></div>
      <div class="sito">Viale Italia 193, Conegliano<small>www.ericaricambi.it</small></div>
    </div>
  </div>
</div>
</body>
</html>
